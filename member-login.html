<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Member Login</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="shortcut icon" href="assets/2vstudio.png" type="image/x-icon">
</head>
<body class="login-body">

<div class="hero-blob blob-1" style="top:10%;left:8%"></div>
<div class="hero-blob blob-2" style="bottom:8%;right:10%"></div>

<a href="index.html" class="back-to-site-btn">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Back to site
</a>

<div class="login-wrap">
  <form class="login-card glass" id="member-login-form" novalidate>
    <img src="assets/2v%20logo.png" alt="2vStudio" class="login-logo-img" />
    <h1 style="text-align:center">Member Access</h1>
    <p class="login-hint" style="text-align:center">Sign in to manage your own profile and portfolio.</p>

    <label class="field">
      <span>Username</span>
      <input type="text" id="member-username" placeholder="Your username" autocomplete="username" required />
    </label>
    <label class="field">
  <span>Password</span>
  <div class="password-field-wrap">
    <input type="password" id="member-password" placeholder="Enter your password" autocomplete="current-password" required />
    <button type="button" class="password-toggle-btn" data-toggle-password="member-password" aria-label="Show password">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</label>
    <div id="member-login-error" class="login-error" hidden>Incorrect username or password.</div>

    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px" id="member-login-submit">Sign In</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/modal.js"></script>
<script>
  document.getElementById('member-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('member-username').value.trim();
    const password = document.getElementById('member-password').value;
    const errorBox = document.getElementById('member-login-error');
    const submitBtn = document.getElementById('member-login-submit');

    errorBox.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    try {
      const editor = await MemberSession.login(username, password);
      if (editor) {
        window.location.href = 'member.html';
      } else {
        errorBox.hidden = false;
        document.getElementById('member-password').focus();
      }
    } catch (err) {
      console.error('Member login failed', err);
      errorBox.textContent = 'Something went wrong. Please try again.';
      errorBox.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
</script>
  <script>
  document.querySelectorAll('[data-toggle-password]').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.togglePassword);
      if (!input) return;
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.innerHTML = isHidden
        ? `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>`
        : `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });
  });
</script>
</body>
</html>
